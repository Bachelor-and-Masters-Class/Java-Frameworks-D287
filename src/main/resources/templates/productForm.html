<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Form</title>
</head>
<body>
<h1>Product Detail</h1>

<form th:action="@{/showFormAddProduct}" th:object="${product}" method="post">

    <div th:if="${error}" style="color:red; font-weight:bold; margin-bottom:10px;">
        <p th:text="${error}"></p>
    </div>

    <div th:if="${#fields.hasErrors('*')}">
        <ul>
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
        </ul>
    </div>

    <input type="hidden" th:field="*{id}"/>

    <p><input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/></p>
    <p><input type="text" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4"/></p>
    <p><input type="text" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4"/></p>

    <p><input type="submit" value="Submit"/>
        <button type="button" onclick="window.location.href='/mainscreen'">Return to Main Screen</button>
    </p>
</form>

<h2>Available Parts</h2>
<table class="table table-bordered table-striped">
    <thead>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Inventory</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="part : ${availparts}">
        <td th:text="${part.name}">Name</td>
        <td th:text="${part.price}">Price</td>
        <td th:text="${part.inv}">Inventory</td>
        <td>
            <a th:href="@{'/associatepart'(partID=${part.id})}">Add</a>
        </td>
    </tr>
    </tbody>
</table>

<h2>Associated Parts</h2>
<table class="table table-bordered table-striped">
    <thead>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Inventory</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="part : ${assparts}">
        <td th:text="${part.name}">Name</td>
        <td th:text="${part.price}">Price</td>
        <td th:text="${part.inv}">Inventory</td>
        <td>
            <a th:href="@{/removepart(partID=${part.id})}">Remove</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
