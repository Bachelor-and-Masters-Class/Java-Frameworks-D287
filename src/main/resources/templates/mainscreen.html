<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RepairPro Hardware</title>
    <style>
        .product-entry {
            margin-bottom: 1em;
        }
        .product-buttons form {
            display: inline;
        }
        .alert {
            margin: 1em 0;
            padding: 0.75em;
            border: 1px solid #ccc;
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>
<header>
    <h1>RepairPro Hardware</h1>
    <nav>
        <a href="/mainscreen">Home</a>
        <a href="/about">About Us</a>
    </nav>
</header>

<main>
    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <section id="products">
        <h2>Our Products</h2>

        <div class="product-entry" th:each="product : ${productList}">
            <p><strong>ID:</strong> <span th:text="${product.id}">0</span></p>
            <p><strong>Name:</strong> <span th:text="${product.name}">Product Name</span></p>
            <p><strong>Price:</strong> $<span th:text="${product.price}">0.00</span></p>
            <p><strong>Inventory:</strong> <span th:text="${product.inv}">0</span></p>

            <div th:if="${product.parts != null}">
                <p><strong>Associated Parts:</strong></p>
                <ul>
                    <li th:each="part : ${product.parts}" th:text="${part.name}"></li>
                </ul>
            </div>

            <div class="product-buttons">
                <form th:action="@{'/buy/' + ${product.id}}" method="post">
                    <button type="submit">Buy Now</button>
                </form>

                <form th:action="@{/showProductFormForUpdate}" method="get">
                    <input type="hidden" name="productID" th:value="${product.id}" />
                    <button type="submit">Update</button>
                </form>

                <form th:action="@{'/products/delete/' + ${product.id}}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </div>
    </section>

    <section id="parts">
        <h2>Available Parts</h2>
        <ul>
            <li th:each="part : ${partList}" th:text="${part.name}"></li>
        </ul>
        <form th:action="@{/showFormAddPart}" method="get">
            <button type="submit">Add New Part</button>
        </form>
    </section>
</main>
</body>
</html>
