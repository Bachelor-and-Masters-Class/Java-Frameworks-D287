<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RepairPro Hardware</title>
    <style>
        .product-entry {
            margin-bottom: 1em;
        }
        .product-buttons form {
            display: inline;
        }
        .alert {
            margin: 1em 0;
            padding: 0.75em;
            border: 1px solid #ccc;
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>
<header>
    <h1>RepairPro Hardware</h1>
    <nav>
        <a href="/mainscreen">Home</a>
        <a href="/about">About Us</a>
    </nav>
</header>

<main>
    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <section id="products">
        <h2>Our Products</h2>

        <form th:action="@{/showFormAddProduct}" method="get">
            <button type="submit">Add New Product</button>
        </form>

        <div class="product-entry" th:each="product : ${productList}">
            <p><strong>ID:</strong> <span th:text="${product.id}">0</span></p>
            <p><strong>Name:</strong> <span th:text="${product.name}">Product Name</span></p>
            <p><strong>Price:</strong> $<span th:text="${product.price}">0.00</span></p>
            <p><strong>Inventory:</strong> <span th:text="${product.inv}">0</span></p>
            <p><strong>Min Inventory:</strong> <span th:text="${product.min}">0</span></p>
            <p><strong>Max Inventory:</strong> <span th:text="${product.max}">0</span></p>

            <div th:if="${product.parts != null}">
                <p><strong>Associated Parts:</strong></p>
                <ul>
                    <li th:each="part : ${product.parts}">
                        <span th:text="${part.name}">Part Name</span> -
                        <span th:text="'Inventory: ' + ${part.inv}">Inventory: 0</span>
                        <span th:text="'Min: ' + ${part.minInv}">Min: 0</span> -
                        <span th:text="'Max: ' + ${part.maxInv}">Max: 0</span>
                    </li>
                </ul>
            </div>

            <div class="product-buttons">
                <form th:action="@{'/buy/' + ${product.id}}" method="post">
                    <button type="submit">Buy Now</button>
                </form>

                <form th:action="@{/showProductFormForUpdate}" method="get">
                    <input type="hidden" name="productID" th:value="${product.id}" />
                    <button type="submit">Update</button>
                </form>

                <form th:action="@{'/products/delete/' + ${product.id}}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </div>
    </section>

    <section id="parts">
        <h2>Available Parts</h2>
        <ul>
            <li th:each="part : ${partList}">
                <span th:text="${part.name}">Part Name</span> -
                <span th:text="'Inventory: ' + ${part.inv}">Inventory: 0</span> -
                <span th:text="'Min: ' + ${part.minInv}">Min: 0</span> -
                <span th:text="'Max: ' + ${part.maxInv}">Max: 0</span>

                <form th:action="@{/showPartFormForUpdate}" method="get" style="display:inline;">
                    <input type="hidden" name="partID" th:value="${part.id}" />
                    <button type="submit">Update</button>
                </form>

                <form th:action="@{/deletepart}" method="get" style="display:inline;">
                    <input type="hidden" name="partID" th:value="${part.id}" />
                    <button type="submit">Delete</button>
                </form>
            </li>
        </ul>

        <form th:action="@{/showFormAddInhousePart}" method="get">
            <button type="submit">Add Inhouse Part</button>
        </form>

        <form th:action="@{/showFormAddOutsourcedPart}" method="get">
            <button type="submit">Add Outsourced Part</button>
        </form>
    </section>
</main>
</body>
</html>
