<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inhouse Part Form</title>
</head>
<body>

<h1>Inhouse Part Detail</h1>

<form th:action="@{/saveInhousePart}" th:object="${inhousepart}" method="POST">

    <!-- Hidden field for ID -->
    <p><input type="hidden" th:field="*{id}" /></p>

    <!-- Part Name -->
    <p><label>
        <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</p>

    <!-- Price -->
    <p><label>
        <input type="number" step="0.01" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</p>

    <!-- Inventory -->
    <p><label>
        <input type="number" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</p>

    <!-- Minimum Inventory -->
    <p><label>
        <input type="number" th:field="*{minInv}" placeholder="Minimum Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Min Inventory Error</p>

    <!-- Maximum Inventory -->
    <p><label>
        <input type="number" th:field="*{maxInv}" placeholder="Maximum Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Max Inventory Error</p>

    <!-- Submit -->
    <p><input type="submit" value="Submit" /></p>

</form>

<a href="/mainscreen">Link to Main Screen</a>

</body>
</html>
