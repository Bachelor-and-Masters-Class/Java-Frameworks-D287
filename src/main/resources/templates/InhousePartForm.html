<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inhouse Part Form</title>
</head>
<body>

<h1>Inhouse Part Detail</h1>

<form th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST">

    <p><input type="hidden" th:field="*{id}" /></p>

    <p><label>
        <input type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4" />
    </label></p>

    <p><label>
        <input type="text" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</p>

    <p><label>
        <input type="text" th:field="*{inv}" placeholder="Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</p>

    <p><label>
        <input type="text" th:field="*{minInv}" placeholder="Minimum Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Min Inventory Error</p>

    <p><label>
        <input type="text" th:field="*{maxInv}" placeholder="Maximum Inventory" class="form-control mb-4 col-4" />
    </label></p>
    <p th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Max Inventory Error</p>

    <p><label>
        <input type="text" placeholder="Part ID" class="form-control mb-4 col-4" />
    </label></p>

    <p><input type="submit" value="Submit" /></p>

</form>

<a href="http://localhost:8080/">Link to Main Screen</a>

</body>
</html>
